<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사전과제 제출 현황</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
@font-face{font-family:'Paperlogy';font-weight:500;font-display:swap;src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2')}
@font-face{font-family:'Paperlogy';font-weight:800;font-display:swap;src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2')}

/* Layout: 상단 요약 → 탭 → (넓은 화면) 왼쪽 명단 · 오른쪽 문서 / (좁은 화면) 위아래 */
:root{
  --paper:#FAF9F5; --surface:#FFFFFF; --sunk:#F2F0EA;
  --ink:#212326; --ink-2:#585F61; --ink-3:#8A9193; --line:#E3E0D7;
  --teal:#176C86; --teal-deep:#1C6077; --on-teal:#FFFFFF; --teal-soft:#E3EFF2;
  --apricot:#FFB098; --apricot-soft:#FFEDE5; --on-apricot:#3A2018;
  --coral:#E84958; --ok:#2C7A57; --ok-soft:#E3F1EA; --logo-bg:transparent;
  --display:'Paperlogy','Pretendard','Noto Sans KR',system-ui,sans-serif;
  --body:'Pretendard','Noto Sans KR',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121718; --surface:#1A2123; --sunk:#151B1D; --ink:#ECEAE4; --ink-2:#A9B1B2; --ink-3:#768082; --line:#2B3538;
  --teal:#62B6CE; --teal-deep:#86C8DA; --on-teal:#0B1A1F; --teal-soft:#183039;
  --apricot:#FFB098; --apricot-soft:#3A2822; --on-apricot:#2B140D; --coral:#FF6F7C; --ok:#6CC59A; --ok-soft:#173026; --logo-bg:#F4F2EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121718; --surface:#1A2123; --sunk:#151B1D; --ink:#ECEAE4; --ink-2:#A9B1B2; --ink-3:#768082; --line:#2B3538;
  --teal:#62B6CE; --teal-deep:#86C8DA; --on-teal:#0B1A1F; --teal-soft:#183039;
  --apricot:#FFB098; --apricot-soft:#3A2822; --on-apricot:#2B140D; --coral:#FF6F7C; --ok:#6CC59A; --ok-soft:#173026; --logo-bg:#F4F2EC; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.demo{background:var(--sunk);border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.demo .wrap{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;padding-block:8px}
.demo a{color:var(--teal);font-weight:600}

.btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.btn:disabled{opacity:.55;cursor:default}

/* login */
.gate{min-height:70vh;display:grid;place-items:center;padding-block:40px}
.gate form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:grid;gap:14px}
.gate h1{font-size:22px;font-weight:800}
.input{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 14px;font-size:16px}
.input:focus{outline:none;border-color:var(--teal)}
.err{color:var(--coral);font-weight:600;font-size:14px}

/* header */
.head{border-bottom:1px solid var(--line);background:var(--surface)}
.head .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{display:inline-flex;background:var(--logo-bg);border-radius:6px;padding:3px 5px}
.logo img{height:24px;display:block}
.brand h1{font-size:19px;font-weight:800}
.brand p{font-size:13px;color:var(--ink-2)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* summary */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:20px}
.sum div{background:var(--surface);padding:14px 18px;display:grid;gap:2px}
.sum span{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.sum b{font-family:var(--display);font-size:28px;font-weight:800}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.d-done{background:var(--ok)} .d-edit{background:var(--apricot)} .d-draft{background:var(--teal)} .d-none{background:var(--ink-3)}
.progress{height:8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;display:flex;margin-top:10px}
.progress i{display:block;height:100%}
@media (max-width:640px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:24px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:700;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--apricot)}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-block:14px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.search{flex:1;min-width:160px;max-width:260px;margin-left:auto}
.search input{padding:8px 12px;font-size:14px}

/* by student */
.split{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start;padding-bottom:60px}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 16px;cursor:pointer}
.list button:first-child{border-top:0}
.list button:hover{background:var(--sunk)}
.list button[aria-current="true"]{background:var(--teal-soft)}
.list .nm{font-weight:700}
.list .meta{font-size:12.5px;color:var(--ink-2);grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;align-self:center}
.p-done{background:var(--ok-soft);color:var(--ok)}
.p-edit{background:var(--apricot-soft);color:var(--ink)}
.p-draft{background:var(--teal-soft);color:var(--teal-deep)}
.p-none{background:var(--sunk);color:var(--ink-2);border:1px solid var(--line)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:12px;min-width:0}
.detail .bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-2)}

/* sheet */
.sheet{background:#fff;color:#1d1d1d;border:1px solid var(--line);border-radius:4px;padding:clamp(20px,4vw,48px) clamp(16px,4vw,52px);font-size:14.5px;line-height:1.8;box-shadow:0 8px 24px rgba(20,30,35,.08);max-height:calc(100vh - 140px);overflow:auto}
.sheet .s-top{text-align:center;display:grid;gap:3px;padding-bottom:14px;border-bottom:2px solid #1d1d1d}
.sheet .t1{font-family:var(--display);font-weight:800;font-size:17px}
.sheet .t2{font-family:var(--display);font-weight:500;font-size:14px;color:#444}
.sheet table{color:inherit;width:100%;border-collapse:collapse;margin:12px 0 18px;font-size:13.5px}
.sheet th,.sheet td{border:1px solid #bbb;padding:7px 10px;text-align:left}
.sheet th{background:#f3f1ec;width:80px;letter-spacing:.2em}
.sheet .s-q{margin-top:18px}
.sheet h3{font-family:var(--body);font-size:15px;font-weight:800}
.sheet .s-ask{color:#555;font-size:13px;margin:2px 0 6px}
.sheet .s-ans{white-space:pre-wrap}
.sheet .s-cnt{font-size:12px;color:#888;text-align:right}
.sheet .s-empty{color:#b14}
.sheet .s-files{margin-top:6px;font-size:13px;color:#555;display:flex;gap:6px;flex-wrap:wrap}
.sheet .s-files a{color:#176C86}
.draftmark{background:var(--apricot-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600}

/* by question */
.qpick{display:flex;gap:8px;flex-wrap:wrap}
.qtitle{padding:4px 0 14px;display:grid;gap:4px}
.qtitle h2{font-size:18px}
.answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:14px;padding-bottom:60px}
.ans{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:8px;align-content:start}
.ans header{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ans .who{font-weight:700}
.ans .txt{white-space:pre-wrap;font-size:14.5px;line-height:1.75}
.ans .afiles{font-size:13px;color:var(--ink-2)}
.ans .afiles a{color:var(--teal)}
.ans .cnt{font-size:12px;color:var(--ink-3)}

#printArea{display:none}
@media print{
  body{background:#fff}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea .sheet{box-shadow:none;border:0;max-height:none;overflow:visible;padding:0;page-break-after:always;break-after:page}
  @page{size:A4;margin:18mm 18mm}
}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40}
</style>
</head>
<body>
<div class="demo" id="demoBar" hidden><div class="wrap"><span>미리보기 모드 · 예시 학생 데이터와 이 브라우저에서 작성한 내용이 함께 보입니다</span><a href="index.html">← 학생 화면</a></div></div>

<section id="gate" class="wrap gate">
  <form id="gateForm" novalidate>
    <h1>사전과제 제출 현황</h1>
    <p class="muted">미술분야 심화 멘토링 운영진·멘토 전용 화면입니다.</p>
    <input class="input" id="code" type="password" autocomplete="current-password" placeholder="관리자 코드">
    <p class="err" id="gateErr" hidden></p>
    <button class="btn btn-primary" style="justify-content:center;padding:12px" id="gateBtn">들어가기</button>
  </form>
</section>

<section id="app" hidden>
  <header class="head"><div class="wrap">
    <div class="brand">
      <div><h1>사전과제 제출 현황</h1><p class="num" id="deadlineInfo"></p></div>
    </div>
    <div class="actions">
      <button class="btn" id="refresh">새로고침</button>
      <button class="btn" id="csv" data-real>엑셀(CSV) 내려받기</button>
      <button class="btn btn-primary" id="printAll" data-real>제출본 전체 인쇄</button>
    </div>
  </div></header>

  <div class="wrap">
    <div class="sum num" id="sum"></div>
    <div class="progress" id="prog" aria-hidden="true"></div>

    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="student">학생별 보기</button>
      <button role="tab" aria-selected="false" data-tab="question">문항별 모아보기</button>
    </div>

    <div id="tab-student">
      <div class="tools">
        <div style="display:flex;gap:6px;flex-wrap:wrap" id="filters"></div>
        <div class="search"><input class="input" id="q" type="search" placeholder="이름 검색"></div>
      </div>
      <div class="split">
        <div class="list" id="list"></div>
        <div class="detail" id="detail"><div class="empty">왼쪽에서 학생을 고르면 답변이 문서 형태로 보여요.</div></div>
      </div>
    </div>

    <div id="tab-question" hidden>
      <div class="tools">
        <div class="qpick" id="qpick"></div>
        <label style="margin-left:auto;display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" id="incDraft"> 작성 중인 답변도 보기</label>
      </div>
      <div class="qtitle" id="qtitle"></div>
      <div class="answers" id="answers"></div>
    </div>
  </div>
</section>

<div id="printArea"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycby1ByY8HzRfCQ8ITDH0Vi9kNFDQC9opk3ZraCE-WHCJn1miLqGUCmG9z9wEvhGhQ7ppmA/exec';   // 학생 화면(index.html)과 같은 Apps Script 웹앱 주소
const DEMO = !API_URL;
const QUESTIONS = [
  {t:'제작 의도와 표현 방법', q:'여름 워크숍에서 작품을 통해 무엇을 표현하고자 했으며, 그 의도를 담기 위해 어떤 표현 방법을 선택했나요?'},
  {t:'제작 과정과 피드백을 통한 변화', q:'제작 과정에서 어떤 시도를 했고 어떤 어려움을 겪었나요? 친구·교강사·멘토와의 대화와 피드백은 자신의 생각과 작업에 어떤 변화를 가져왔나요?'},
  {t:'작업에 대한 성찰과 자기 발견', q:'제작 과정과 결과물을 돌아볼 때, 만족스러운 점과 보완하고 싶은 점은 무엇인가요? 이 경험을 통해 자신의 관심과 강점에 대해 새롭게 알게 된 점은 무엇인가요?'},
  {t:'워크숍 경험의 발전과 심화 멘토링 방향', q:'여름 워크숍에서 갖게 된 관심이나 시도한 작업을 심화 멘토링을 통해 어떻게 확장하고 발전시키고 싶나요? 이와 관련하여 선생님들께 질문하거나 조언 받고 싶은 내용은 무엇인가요?'}
];
const STATUS = {
  '제출 완료':{cls:'p-done',dot:'d-done'},
  '제출 후 수정 중':{cls:'p-edit',dot:'d-edit'},
  '작성 중':{cls:'p-draft',dot:'d-draft'},
  '미작성':{cls:'p-none',dot:'d-none'}
};
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const len = s => [...String(s||'')].length;
const total = d => d ? (d.answers||[]).reduce((a,s)=>a+len(s),0) : 0;
const fmt = iso => { if(!iso) return ''; const d=new Date(iso); return isNaN(d)?'':`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const normName = n => String(n||'').replace(/\s+/g,'');
function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

/* ===== 미리보기 모드: 예시 데이터 ===== */
const SAMPLE = (() => {
  const a1 = ['여름 워크숍에서 저는 ‘버려진 것들의 두 번째 얼굴’을 주제로 작업했습니다. 학교 앞 재활용장에서 모은 페트병 뚜껑과 포장재를 잘라 붙여, 멀리서 보면 사람의 얼굴처럼 보이고 가까이 가면 쓰레기라는 것이 드러나는 부조를 만들었습니다. 같은 사물이 보는 거리에 따라 다르게 읽히는 경험을 관객이 직접 해 보기를 바랐고, 그래서 색을 칠하지 않고 재료가 가진 원래 색만으로 명암을 만드는 방법을 골랐습니다.',
    '처음에는 뚜껑을 글루건으로 바로 붙였는데, 판이 휘면서 얼굴의 형태가 계속 무너졌습니다. 둘째 날 멘토 선생님께서 바탕을 먼저 격자로 나누고 구역마다 밝기를 정해 두면 좋겠다고 조언해 주셨고, 연필로 밝기 지도를 그린 뒤 재료를 배치하니 형태가 훨씬 안정적으로 잡혔습니다. 옆자리 친구가 가까이서 볼 때 더 재미있다고 말해 준 덕분에, 가까이 다가오는 관객을 위한 작은 디테일도 더 신경 쓰게 되었습니다.',
    '멀리서 얼굴이 보이는 순간은 의도대로 표현되어 만족스럽습니다. 다만 시간에 쫓겨 오른쪽 아래는 재료 배치가 성글어졌고, 그 부분이 화면 전체의 긴장감을 떨어뜨린 것 같아 아쉽습니다. 이번 작업을 하면서 제가 완성된 이미지보다 재료를 모으고 분류하는 과정 자체를 즐긴다는 것을 알게 되었습니다.',
    '심화 멘토링에서는 재료를 어디서 모았는지 기록하는 방식까지 작품에 담아 보고 싶습니다. 동네마다 모이는 재료가 달라지는 것을 보여 주는 연작을 생각하고 있습니다. 선생님들께는 버려진 재료로 만든 작품을 오래 보존하는 방법과, 개념이 강한 작업에서 조형적인 완성도를 함께 끌어올리는 방법을 여쭤보고 싶습니다.'];
  const a2 = ['밤에 혼자 걷는 골목의 소리를 그림으로 옮겨 보고 싶었습니다. 소리는 눈에 보이지 않기 때문에 먹과 물의 번짐으로 소리가 퍼지는 느낌을 표현하려고 했습니다. 한지 위에 물을 먼저 바르고 먹을 떨어뜨려, 번짐의 크기로 소리의 크기를 나타냈습니다.',
    '번짐을 조절하는 것이 가장 어려웠습니다. 물의 양이 조금만 달라져도 결과가 크게 바뀌어서 실패한 종이가 스무 장이 넘었습니다. 교강사 선생님께서 실패한 종이를 버리지 말고 나란히 놓아 보라고 하셨는데, 그렇게 보니 우연한 번짐들이 오히려 하나의 리듬처럼 보였습니다. 그 뒤로는 번짐을 통제하려고 하기보다 관찰하고 고르는 쪽으로 작업 방식이 바뀌었습니다.',
    '실패한 종이들을 이어 붙인 최종 작품은 처음 계획보다 훨씬 자연스러워서 만족합니다. 보완하고 싶은 점은 작품을 설명하는 말이 부족했다는 것입니다. 발표 때 의도를 잘 전달하지 못해서, 앞으로는 작업 노트를 꾸준히 쓰려고 합니다.',
    '소리를 그림으로 옮기는 작업을 영상이나 설치로 넓혀 보고 싶습니다. 실제 골목에서 녹음한 소리와 그림을 함께 보여 주는 방식도 생각하고 있습니다. 매체를 바꿀 때 처음 작업의 감각을 잃지 않는 방법을 선생님들께 여쭤보고 싶습니다.'];
  const d3 = ['색이 섞이는 순간을 멈춰 놓은 것처럼 보이게 하고 싶었습니다. 그래서 아크릴 물감을 유리판 위에서 섞고 그대로 종이에 찍어 내는 방법을 써 보았습니다.', '', '', ''];
  return {
    roster:[
      {name:'김하린',birth:'2011-04-02',school:'예시중학교',grade:'3'},
      {name:'이도윤',birth:'2010-09-17',school:'예시고등학교',grade:'1'},
      {name:'박서진',birth:'2012-01-25',school:'예시중학교',grade:'2'},
      {name:'최유나',birth:'2009-06-08',school:'예시고등학교',grade:'2'}
    ],
    records:[
      {name:'김하린',birth:'2011-04-02',submitted:{level:'중학교',grade:'3',answers:a1,files:[[{id:'x1',name:'워크숍_작품사진.jpg',size:2400000,url:''}],[{id:'x2',name:'밝기지도_스케치.png',size:860000,url:''}],[],[]]},draft:null,submittedAt:'2026-10-17T21:14:00+09:00',firstSubmittedAt:'2026-10-17T21:14:00+09:00',savedAt:'2026-10-17T21:14:00+09:00',count:1},
      {name:'이도윤',birth:'2010-09-17',submitted:{level:'고등학교',grade:'1',answers:a2,files:[]},draft:{level:'고등학교',grade:'1',answers:[a2[0],a2[1]+' 지금 다시 보니 이 부분을 더 쓰고 싶어요.',a2[2],a2[3]],files:[]},submittedAt:'2026-10-16T19:40:00+09:00',firstSubmittedAt:'2026-10-16T19:40:00+09:00',savedAt:'2026-10-18T10:02:00+09:00',count:1},
      {name:'박서진',birth:'2012-01-25',submitted:null,draft:{level:'중학교',grade:'2',answers:d3,files:[]},savedAt:'2026-10-18T22:31:00+09:00',count:0}
    ]
  };
})();
function demoData(){
  let db = {}; try{ db = JSON.parse(localStorage.getItem('artpw_demo_db')) || {}; }catch(e){}
  const mine = Object.values(db).map(r => ({name:r.name, birth:r.birth, submitted:r.submitted||null, draft:r.draft||null, submittedAt:r.submittedAt, firstSubmittedAt:r.firstSubmittedAt, savedAt:r.savedAt, count:r.count||0}));
  return {ok:true, deadline:'2026-10-22T23:59:59+09:00', open:true, roster:SAMPLE.roster, records:[...SAMPLE.records, ...mine]};
}

async function load(code){
  if (DEMO){ await new Promise(r=>setTimeout(r,250)); return demoData(); }
  const res = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'admin',code})});
  const j = await res.json(); if (!j.ok){ const e=new Error(j.message); e.code=j.code; throw e; } return j;
}

/* ===== 데이터 가공 ===== */
let RAW = null, ROWS = [], CODE = '', filter = '전체', sel = null, qi = 0;
/* 첨부파일은 문항별 목록 4개 [[…],[…],[…],[…]] — 예전 형식(한 줄 목록)도 받아 줌 */
function normalize(d){
  if (!d) return null;
  let f = d.files || [];
  if (f.length && !Array.isArray(f[0])) f = [f,[],[],[]];
  return {level:d.level||'', grade:String(d.grade||''), answers:[0,1,2,3].map(i=>(d.answers||[])[i]||''), files:[0,1,2,3].map(i=>Array.isArray(f[i])?f[i]:[])};
}
const sig = d => d ? JSON.stringify([d.level,d.grade,d.answers,d.files.map(a=>a.map(f=>f.id))]) : '';
const fileCount = d => d ? d.files.reduce((a,l)=>a+l.length,0) : 0;
const fileLink = f => f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>` : esc(f.name);
function build(){
  const byKey = new Map();
  RAW.records.forEach(r0 => {
    const r = {...r0, submitted:normalize(r0.submitted), draft:normalize(r0.draft)};
    const k = normName(r.name)+'|'+r.birth;
    const status = r.submitted ? (r.draft && sig(r.draft)!==sig(r.submitted) ? '제출 후 수정 중' : '제출 완료') : '작성 중';
    const base = r.submitted || r.draft || {};
    byKey.set(k, {...r, key:k, status, level:base.level||'', grade:base.grade||'', chars:total(r.submitted||r.draft), files:fileCount(r.submitted||r.draft), inRoster:false});
  });
  RAW.roster.forEach(p => {
    const k = normName(p.name)+'|'+p.birth;
    if (byKey.has(k)) byKey.get(k).inRoster = true;
    else byKey.set(k, {key:k, name:p.name, birth:p.birth, status:'미작성', level:'', grade:p.grade||'', school:p.school, chars:0, files:0, inRoster:true});
  });
  const order = {'제출 완료':0,'제출 후 수정 중':1,'작성 중':2,'미작성':3};
  ROWS = [...byKey.values()].sort((a,b)=> order[a.status]-order[b.status] || a.name.localeCompare(b.name,'ko'));
}

/* ===== 렌더 ===== */
function renderSum(){
  const c = s => ROWS.filter(r=>r.status===s).length;
  const n = ROWS.length, done=c('제출 완료'), edit=c('제출 후 수정 중'), draft=c('작성 중'), none=c('미작성');
  $('#sum').innerHTML = `
    <div><span>전체 학생</span><b>${n}</b></div>
    <div><span><i class="dot d-done"></i>제출</span><b>${done+edit}</b></div>
    <div><span><i class="dot d-draft"></i>작성 중</span><b>${draft}</b></div>
    <div><span><i class="dot d-none"></i>미작성</span><b>${none}</b></div>`;
  const w = x => n ? (x/n*100)+'%' : 0;
  $('#prog').innerHTML = `<i class="d-done" style="width:${w(done)}"></i><i class="d-edit" style="width:${w(edit)}"></i><i class="d-draft" style="width:${w(draft)}"></i>`;
  const end = new Date(RAW.deadline);
  $('#deadlineInfo').textContent = `마감 ${end.getMonth()+1}월 ${end.getDate()}일 ${String(end.getHours()).padStart(2,'0')}:${String(end.getMinutes()).padStart(2,'0')} · ${RAW.open && Date.now()<end ? '접수 중' : '접수 종료'} · 제출 ${done+edit}/${n}명`;
  $('#filters').innerHTML = ['전체','제출 완료','제출 후 수정 중','작성 중','미작성'].map(f =>
    `<button class="chip" aria-pressed="${f===filter}" data-f="${f}">${f} <span class="num">${f==='전체'?n:c(f)}</span></button>`).join('');
}
function renderList(){
  const q = normName($('#q').value);
  const rows = ROWS.filter(r => (filter==='전체'||r.status===filter) && (!q || normName(r.name).includes(q)));
  $('#list').innerHTML = rows.length ? rows.map(r => `
    <button data-k="${esc(r.key)}" aria-current="${sel===r.key}">
      <span class="nm">${esc(r.name)}</span><span class="pill ${STATUS[r.status].cls}">${r.status}</span>
      <span class="meta num"><span>${r.level?esc(r.level)+' ':''}${r.grade?esc(r.grade)+'학년':''}</span><span>${r.chars.toLocaleString()}자</span>${r.files?`<span>첨부 ${r.files}</span>`:''}<span>${r.submittedAt?'제출 '+fmt(r.submittedAt):r.savedAt?'저장 '+fmt(r.savedAt):''}</span>${r.inRoster||!RAW.roster.length?'':'<span style="color:var(--coral)">명단 외</span>'}</span>
    </button>`).join('') : '<div class="empty">해당하는 학생이 없어요.</div>';
}
function sheetHTML(d, name){
  const lv = v => `${d.level===v?'■':'□'} ${v}`;
  return `<div class="s-top"><span class="t1">2026 K예술영재 프로젝트 미술분야 심화 멘토링 사전과제</span><span class="t2">여름 워크숍을 통한 발견과 성장, 그리고 새로운 탐구</span></div>
    <table><tr><th>학년</th><td>${lv('중학교')} &nbsp; ${lv('고등학교')} &nbsp; ( ${esc(d.grade)||'&nbsp;&nbsp;'} )학년</td></tr><tr><th>이름</th><td>${esc(name)}</td></tr></table>
    ${QUESTIONS.map((q,i)=>`<div class="s-q"><h3>${i+1}. ${esc(q.t)}</h3><p class="s-ask">${esc(q.q)}</p><p class="s-ans">${d.answers[i]?esc(d.answers[i]):'<span class="s-empty">(작성하지 않음)</span>'}</p>${d.files[i].length?`<div class="s-files">첨부파일: ${d.files[i].map(fileLink).join(' · ')}</div>`:''}<p class="s-cnt num">${len(d.answers[i]).toLocaleString()}자</p></div>`).join('')}`;
}
function renderDetail(){
  const r = ROWS.find(x=>x.key===sel), el = $('#detail');
  if (!r){ el.innerHTML = '<div class="empty">왼쪽에서 학생을 고르면 답변이 문서 형태로 보여요.</div>'; return; }
  if (r.status==='미작성'){ el.innerHTML = `<div class="empty"><b>${esc(r.name)}</b> 학생은 아직 작성을 시작하지 않았어요.</div>`; return; }
  const showDraft = !r.submitted, d = r.submitted || r.draft;
  el.innerHTML = `
    <div class="bar"><span class="num">생년월일 ${esc(r.birth)} · ${r.submittedAt?`최종 제출 ${fmt(r.submittedAt)} (${r.count}회)`:''}</span><span class="pill ${STATUS[r.status].cls}">${r.status}</span></div>
    ${showDraft?'<p class="draftmark">아직 제출하지 않은 임시저장본이에요.</p>':''}
    ${r.status==='제출 후 수정 중'?'<p class="draftmark">제출 뒤 학생이 고치는 중이에요. 아래는 마지막 제출본이에요.</p>':''}
    <div class="sheet">${sheetHTML(d, r.name)}</div>`;
}
function renderQuestion(){
  $('#qpick').innerHTML = QUESTIONS.map((q,i)=>`<button class="chip" aria-pressed="${i===qi}" data-q="${i}">${i+1}번 ${esc(q.t)}</button>`).join('');
  $('#qtitle').innerHTML = `<h2>${qi+1}. ${esc(QUESTIONS[qi].t)}</h2><p class="muted">${esc(QUESTIONS[qi].q)}</p>`;
  const inc = $('#incDraft').checked;
  const rows = ROWS.filter(r => r.submitted || (inc && r.draft));
  $('#answers').innerHTML = rows.length ? rows.map(r => {
    const d = r.submitted || r.draft, a = d.answers[qi] || '';
    return `<article class="ans"><header><span class="who">${esc(r.name)} <span class="muted" style="font-weight:500">${esc(d.level)} ${esc(d.grade)}학년</span></span>${r.submitted?'':'<span class="pill p-draft">작성 중</span>'}</header>
      <p class="txt">${a?esc(a):'<span class="muted">(작성하지 않음)</span>'}</p>${d.files[qi].length?`<p class="afiles">첨부파일: ${d.files[qi].map(fileLink).join(' · ')}</p>`:''}<span class="cnt num">${len(a).toLocaleString()}자</span></article>`;
  }).join('') : '<div class="empty">아직 제출된 답변이 없어요.</div>';
}
function renderAll(){ build(); renderSum(); renderList(); renderDetail(); renderQuestion(); }

/* ===== 이벤트 ===== */
$('#gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#gateBtn'), err = $('#gateErr'); err.hidden = true; btn.disabled = true;
  try{
    CODE = $('#code').value.trim();
    if (!DEMO && !CODE){ throw Object.assign(new Error(),{code:'bad_code'}); }
    RAW = await load(CODE);
    try{ sessionStorage.setItem('artpw_admin', CODE); }catch(_){}
    $('#gate').hidden = true; $('#app').hidden = false; renderAll();
  }catch(ex){ err.textContent = ex.code==='bad_code' ? '관리자 코드가 맞지 않아요.' : '불러오지 못했어요. 잠시 후 다시 시도해 주세요.'; err.hidden = false; }
  finally{ btn.disabled = false; }
});
$('#refresh').addEventListener('click', async () => { try{ RAW = await load(CODE); renderAll(); toast('최신 내용으로 바꿨어요.'); }catch(e){ toast('불러오지 못했어요.'); } });
$('#filters').addEventListener('click', e => { const b=e.target.closest('[data-f]'); if(!b) return; filter=b.dataset.f; renderSum(); renderList(); });
$('#q').addEventListener('input', renderList);
$('#list').addEventListener('click', e => { const b=e.target.closest('[data-k]'); if(!b) return; sel=b.dataset.k; renderList(); renderDetail(); if (window.innerWidth<900) $('#detail').scrollIntoView({behavior:'smooth'}); });
document.querySelectorAll('[data-tab]').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-selected', String(x===t)));
  $('#tab-student').hidden = t.dataset.tab!=='student'; $('#tab-question').hidden = t.dataset.tab!=='question';
}));
$('#qpick').addEventListener('click', e => { const b=e.target.closest('[data-q]'); if(!b) return; qi=+b.dataset.q; renderQuestion(); });
$('#incDraft').addEventListener('change', renderQuestion);

$('#printAll').addEventListener('click', () => {
  const rows = ROWS.filter(r=>r.submitted);
  if (!rows.length){ toast('제출된 과제가 없어요.'); return; }
  $('#printArea').innerHTML = rows.map(r => `<div class="sheet">${sheetHTML(r.submitted, r.name)}</div>`).join('');
  window.print();
});
$('#csv').addEventListener('click', () => {
  const head = ['이름','생년월일','학교급','학년','상태','전체 글자수',...QUESTIONS.map((q,i)=>`${i+1}. ${q.t}`),'첨부파일','최종 제출','제출 횟수'];
  const lines = ROWS.map(r => { const d = r.submitted || r.draft || normalize({});
    return [r.name,r.birth,r.level,r.grade,r.status,r.chars,...[0,1,2,3].map(i=>d.answers[i]||''),d.files.map((l,i)=>l.map(f=>`[${i+1}번] ${f.name}${f.url?' '+f.url:''}`).join(' / ')).filter(Boolean).join(' / '),fmt(r.submittedAt),r.count||0]; });
  const csv = '﻿' + [head,...lines].map(row => row.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const t = new Date(); a.download = `미술분야_사전과제_제출현황_${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}.csv`; a.click();
});

(async function init(){
  $('#demoBar').hidden = !DEMO;
  if (DEMO){ document.querySelectorAll('[data-real]').forEach(b => b.hidden = true); $('#code').placeholder = '관리자 코드 (미리보기에서는 아무 값이나)'; }
  let saved = ''; try{ saved = sessionStorage.getItem('artpw_admin') || ''; }catch(_){}
  if (saved || DEMO){ $('#code').value = saved; }
  if (saved){ $('#gateForm').requestSubmit(); }
})();
</script>
